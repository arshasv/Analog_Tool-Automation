services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: xeda-backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./pdk/sky130A:/opt/sky130_pdk/sky130A:ro
    environment:
      - WORK_DIR=/app/data/designs
      - SKY130_PDK=/opt/sky130_pdk/sky130A
      - PYTHONPATH=/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xeda-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
